<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Website That Gets Shyer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6e8dc;color:#29352e;font-family:Arial,sans-serif;overflow:hidden}main{min-height:100vh;padding:28px;position:relative}header,footer{display:flex;justify-content:space-between;font:700 11px monospace;letter-spacing:.16em}header{border-bottom:1px solid;padding-bottom:14px}.hero{max-width:1000px;margin:10vh auto 4vh}.hero small{font:700 10px monospace;letter-spacing:.2em}.hero h1{font-size:clamp(3rem,9vw,8rem);line-height:.82;letter-spacing:-.07em;margin:.22em 0}.hero p{font-size:clamp(1rem,2vw,1.4rem)}.stage{width:min(1000px,92vw);height:280px;margin:auto;border:1px solid #29352e66;border-radius:28px;padding:38px;background:#fff4;box-shadow:0 30px 80px #0002}.stage p{font-size:clamp(1.2rem,3vw,2.2rem);max-width:720px}.hello{border:1px solid;background:#ef8fb0;color:#29352e;padding:14px 20px;border-radius:999px;font-weight:800;box-shadow:4px 4px 0;cursor:pointer;transition:transform .18s}footer{width:min(1000px,92vw);margin:28px auto}a{color:inherit}</style></head><body><main><header><span>JEAN / WONDER ROOM EXPERIMENT</span><span>01 OF 17</span></header><section class="hero" id="hero"><small>BEAUTIFUL DETOUR / SHYNESS STUDY</small><h1>A Website That Gets Shyer</h1><p>Come closer. Or perhaps don’t.</p></section><section class="stage"><p id="note">I was hoping you would visit. I just was not expecting you to look directly at me.</p><button class="hello" id="hello">SAY HELLO</button></section><footer><span>BUILT FOR CURIOSITY</span><a href="https://github.com/jean-tmk/website-that-gets-shyer">VIEW SOURCE ↗</a></footer></main><script>const b=document.querySelector('#hello'),h=document.querySelector('#hero'),n=document.querySelector('#note');let encounters=0;document.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<190){b.style.transform='translate('+(-dx*.46)+'px,'+(-dy*.46)+'px)';encounters++;h.style.opacity=Math.max(.3,1-encounters/240)}});b.onclick=()=>{n.textContent='Oh. You caught me. Please stay, but maybe stand over there.';b.textContent='THAT IS CLOSE ENOUGH';b.style.transform='none'}</script></body></html>
